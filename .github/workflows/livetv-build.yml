name: Live TV build

# THE live-tv branch's own build: every push to `live-tv` turns into an installable stable package
# on GitHub, with nothing to run by hand. This repository is the frannraf copy of plx-native, where
# the Live TV / DVR work lives; its other television installs from the rolling release this
# workflow keeps current, so the branch's HEAD is always one download away.
#
# What a run does:
#   build    an ARMv7 cross-build of the checked-out commit, the same toolchain, SDK and caches
#            `ci.yml`'s cross-build job uses, packaged as the stable id (`FLAVOR=stable RELEASE=1`,
#            the only pair `release-guard` lets onto com.beb.plxnative) and put through the same
#            packaging gates the main project ships through: `make ipk`'s own check-package.py and
#            check-packaged-elf.py, ci/check-elf.sh, the binary size budget, webosbrew-ipk-verify
#            and the firmware load matrix. The .ipk and its sha256 are kept as a run artifact.
#   publish  the rolling release `livetv-latest`: its tag is moved to the built commit, the package
#            and `ipk.sha256` replace the previous ones, and the notes list the commits since the
#            last build with the install steps. The download URL never changes:
#              https://github.com/frannraf/plx-native/releases/download/livetv-latest/<package>
#            A manual run with `snapshot` on also cuts a dated release (`livetv-YYYY-MM-DD`) that is
#            never moved again, for a build worth keeping by name.
#
# Why it is a separate file and not a caller of build-package.yml: that pipeline is wired to the main
# project's crash reporting (a required Sentry token, production or development telemetry variables
# it refuses to build without), none of which this copy has or wants. The build here compiles with
# no telemetry at all, which the Makefile supports by design ("a checkout without the file still
# builds"); the package reports its version and carries no DSN.
#
# Tags on this copy must not start with `v` or `rc/` — those are what `release.yml` and `rc.yml`
# answer to. `livetv-*` is this workflow's own namespace. The job-level repository guard keeps this
# file inert if it ever travels upstream in a merge.

on:
  push:
    branches: [live-tv]
    # Prose and the site never change the package. The workflow file itself does, and is not listed.
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/DISCUSSION_TEMPLATE/**'
      - '.github/FUNDING.yml'
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Also publish a dated release (livetv-YYYY-MM-DD) that is never moved again'
        type: boolean
        default: false

# A newer push supersedes a build still running for the same branch.
concurrency:
  group: livetv-build-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  ROLLING_TAG: livetv-latest

jobs:
  build:
    name: armv7 stable package + gates
    if: github.repository == 'frannraf/plx-native'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      package: ${{ steps.name.outputs.package }}
      version: ${{ steps.name.outputs.version }}
      sha256: ${{ steps.name.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust and the armv7 target
        uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust-modules
          key: armv7-stable

      - name: Cache the pinned downloads
        uses: ./.github/actions/deps-cache

      - id: ndk
        uses: ./.github/actions/webos-ndk

      - name: Cache the bundled FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/plxnative/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/build-ffmpeg.sh', 'ci/deps.py', 'ci/dependencies.json', 'ci/arm-cc.py', 'ci/check-link-evidence.py', 'ci/stage-link-evidence.py', '.github/actions/webos-ndk/action.yml') }}

      - name: Build + package (stable, release)
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}
          FLAVOR: stable
          RELEASE: "1"
        run: |
          set -euo pipefail
          make -j"$(nproc)"
          make ipk
          grep -q -- '--no-default-features' pkg/.build-config \
            || { echo "::error::RELEASE=1 did not take — pkg/.build-config says [$(cat pkg/.build-config)]"; exit 1; }
          ls -la pkg/*.ipk pkg/ipk.sha256

      - name: Binary size budget
        run: |
          set -euo pipefail
          staged=$(ls ipkroot/data/usr/palm/applications/*/plxnative)
          [ "$(printf '%s\n' "$staged" | wc -l)" -eq 1 ]
          python3 ci/check-build-budgets.py --binary "$staged"

      - name: ELF assertions
        run: ./ci/check-elf.sh
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}

      - name: webosbrew compatibility check
        timeout-minutes: 15
        run: |
          set -euo pipefail
          debs=$(python3 ci/deps.py fetch webosbrew-toolbox --asset fw-symbols --asset ipk-verify)
          sudo apt-get install -y $debs
          webosbrew-ipk-verify --details --format markdown \
            --fw-releases '>=4.0' pkg/*.ipk | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Firmware load matrix
        run: |
          set -euo pipefail
          {
            echo '### Firmware load matrix'
            echo '_Does the process start and do all symbols resolve? Says nothing about playback._'
            echo '```'
            ./tools/fwcompat.py --db /usr/share/webosbrew/compat-checker/data \
              --min-release 4.4.2 pkg/plxnative
            ./tools/fwcompat.py --db /usr/share/webosbrew/compat-checker/data \
              --min-release 4.4.2 pkg/plxnative-storage
            for lib in pkg/lib*-plx.so.*; do
              case "$lib" in *.link.*) continue ;; esac   # the link-evidence sidecars
              ./tools/fwcompat.py --db /usr/share/webosbrew/compat-checker/data \
                --min-release 4.4.2 --shipped pkg "$lib"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Name the package
        id: name
        run: |
          set -euo pipefail
          ipk=$(ls pkg/*.ipk)
          [ "$(printf '%s\n' "$ipk" | wc -l)" -eq 1 ] || { echo "::error::expected one package, found: $ipk"; exit 1; }
          package=$(basename "$ipk")
          version=$(printf '%s' "$package" | sed -E 's/^[^_]+_([^_]+)_arm\.ipk$/\1/')
          sha256=$(sha256sum "$ipk" | cut -d' ' -f1)
          # The sidecar `make ipk` wrote names the same file and the same hash.
          (cd pkg && sha256sum -c ipk.sha256)
          {
            echo "package=$package"
            echo "version=$version"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Package"
            echo "- \`$package\` ($(stat -c %s "$ipk") bytes), version \`$version\`"
            echo "- sha256 \`$sha256\`"
            echo "- commit \`${GITHUB_SHA::12}\` on \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plxnative-livetv-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            pkg/*.ipk
            pkg/ipk.sha256
            pkg/.build-config

  publish:
    name: rolling release
    needs: build
    if: github.repository == 'frannraf/plx-native'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes list the commits since the previous build: the tag it left and the history to it.
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plxnative-livetv-${{ github.sha }}
          path: dist

      - name: Write the release notes
        id: notes
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "refs/tags/$ROLLING_TAG:refs/tags/$ROLLING_TAG" 2>/dev/null || true
          prev=$(git rev-parse -q --verify "refs/tags/$ROLLING_TAG^{commit}" || true)
          if [ -n "$prev" ] && git merge-base --is-ancestor "$prev" "$GITHUB_SHA" && [ "$prev" != "$GITHUB_SHA" ]; then
            since="Commits since the previous build (\`${prev::12}\`):"
            log=$(git log --no-merges --format='- %s (`%h`)' "$prev..$GITHUB_SHA")
          else
            since="Latest commits:"
            log=$(git log --no-merges -n 15 --format='- %s (`%h`)' "$GITHUB_SHA")
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${ROLLING_TAG}/${PACKAGE}"
          cat > notes.md <<EOF
          **PlxNative + Live TV**, built by GitHub Actions from \`live-tv\` @ \`${GITHUB_SHA::12}\` (run [#${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})).

          Stable id \`com.beb.plxnative\`, version \`${VERSION}\`, release build (no telemetry compiled in).

          | asset | sha256 |
          |---|---|
          | \`${PACKAGE}\` | \`${SHA256}\` |

          ${since}
          ${log}

          ### Install

          **Rooted TV (Homebrew Channel, root ssh).** On the TV:

          \`\`\`sh
          cd /tmp
          curl -fL --max-time 600 -o plxnative.ipk ${url}
          echo "${SHA256}  plxnative.ipk" | sha256sum -c
          luna-send -i luna://com.webos.appInstallService/dev/install '{"id":"com.ares.defaultName","ipkUrl":"/tmp/plxnative.ipk","subscribe":true}'
          \`\`\`

          Wait for \`"state":"installed"\`, then Ctrl-C. On webOS 10 \`luna-send\` prints nothing without a terminal: use \`ssh -t\`, or wrap it in \`script -qc '…' /dev/null\` from a script.

          **Developer Mode (no root).** Install the \`.ipk\` with [webOS Dev Manager](https://github.com/webosbrew/dev-manager-desktop) or \`ares-install --device <tv> ${PACKAGE}\`.

          Installing over an earlier build keeps the app's sign-in and settings. It is the same app id as upstream's PlxNative, so it replaces an installed upstream copy; if Homebrew Channel later offers upstream's next version over it, decline (that would remove Live TV).
          EOF
          echo "title=PlxNative + Live TV — latest (${VERSION}, live-tv @ ${GITHUB_SHA::12})" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Move the rolling tag and refresh its release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          set -euo pipefail
          # The tag follows the build it names. A lightweight tag, moved by force: it is a pointer to
          # "the newest build", not a record (the dated snapshots are the records).
          git push --force --quiet origin "$GITHUB_SHA:refs/tags/$ROLLING_TAG"
          if gh release view "$ROLLING_TAG" --json id >/dev/null 2>&1; then
            # Replace every asset: a version bump renames the package and must not leave the old one.
            for old in $(gh release view "$ROLLING_TAG" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$ROLLING_TAG" "$old" --yes
            done
            gh release edit "$ROLLING_TAG" --title "$TITLE" --notes-file notes.md --latest --prerelease=false
            gh release upload "$ROLLING_TAG" dist/*.ipk dist/ipk.sha256
          else
            gh release create "$ROLLING_TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md --latest \
              dist/*.ipk dist/ipk.sha256
          fi
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ steps.notes.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dated snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="livetv-$(date -u +%Y-%m-%d)"
          # A second snapshot on the same day gets the run number, never a moved tag.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then tag="$tag-run${GITHUB_RUN_NUMBER}"; fi
          sed "s#releases/download/${ROLLING_TAG}/#releases/download/${tag}/#g" notes.md > snapshot.md
          gh release create "$tag" --target "$GITHUB_SHA" --latest=false \
            --title "PlxNative + Live TV (${tag#livetv-}, ${VERSION}, live-tv @ ${GITHUB_SHA::12})" \
            --notes-file snapshot.md dist/*.ipk dist/ipk.sha256
          echo "- snapshot: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
